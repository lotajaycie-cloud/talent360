<style>
  :root {
    --brand:#7C1F3D; --brand-dark:#5C1730; --brand-bg:#F8ECEF;
    --ink:#16171B; --ink-2:#6B7280; --ink-3:#9CA0AC;
    --hero:#16171F;
    --mint-bg:#E3F4EA; --mint-line:#2F9E5C;
    --amber-bg:#FDF1D9; --amber-line:#C98A1F;
    --lav-bg:#EFE9FB; --lav-line:#6B4FC9;
    --green-bg:#E1F5EC; --green:#1F9254;
    --blue-bg:#E8ECFD; --blue:#4C5FD5;
    --red-bg:#FBE4E2; --red:#C4433A;
    --surface:#fff; --bg:#F7F7F9; --border:#ECEDF1;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .shell { display:flex; min-height:100vh; }

  /* ---- Two-tier sidebar ---- */
  .rail { width:76px; background:var(--surface); border-right:1px solid var(--border); flex-shrink:0; padding:18px 0; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .rail-logo { width:52px; height:52px; border-radius:50%; margin-bottom:14px; overflow:hidden; }
  .rail-logo img { width:100%; height:100%; object-fit:contain; display:block; }

  /* ---- Premium transitions & hover polish ---- */
  * { transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .12s ease, opacity .15s ease; }
  .rail-item, .subitem, .tab-btn, .btn, .icon-btn, .ai-pill, .cell, .rank-row, .filter-pill, .mic-btn, table.t tr.click, select, input, textarea { transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .18s ease, transform .12s ease; }
  .card:hover { box-shadow: 0 4px 16px rgba(16,24,40,.08); transform: translateY(-1px); }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.15); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .rail-item:hover .ricon { background: rgba(255,255,255,.08); }
  .cell:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,24,40,.1); }
  .rank-row:hover { background: var(--bg); border-radius: 8px; padding-left: 6px; padding-right: 6px; margin: 0 -6px; }
  .mic-btn:hover:not(:disabled) { transform: scale(1.06); }
  table.t tr.click:hover { transform: none; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .content.fade-in { animation: fadeInUp .28s ease; }
  @keyframes fadeInScale { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: scale(1); } }
  .notif-panel { animation: fadeInScale .16s ease; transform-origin: top right; }
  .rail-item { background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:11px 4px; width:68px; color:var(--ink-3); font-size:10.5px; font-weight:700; letter-spacing:.01em; line-height:1.25; }
  .rail-item .ricon { width:34px; height:3px; border-radius:2px; background:transparent; }
  .rail-item.active .ricon { background:var(--brand); }
  .rail-item.active { color:var(--ink); }

  .subpanel { width:190px; background:var(--surface); border-right:1px solid var(--border); flex-shrink:0; padding:20px 0; }
  .subpanel h4 { font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:0 0 14px; padding:0 20px; }
  .subitem { display:block; width:100%; text-align:left; background:none; border:none; border-left:3px solid transparent; color:var(--ink-2); font-size:13.5px; font-weight:600; padding:11px 17px; cursor:pointer; letter-spacing:-.005em; }
  .subitem:hover { background:var(--bg); }
  .subitem.active { border-left-color:var(--brand); color:var(--brand); font-weight:800; background:var(--brand-bg); }

  .main { flex:1; display:flex; flex-direction:column; min-width:0; }

  /* ---- Topbar ---- */
  .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; gap:16px; }
  .breadcrumb { font-size:13.5px; color:var(--ink-3); }
  .breadcrumb b { color:var(--ink); font-weight:700; }
  .topbar-spacer { flex:1; }
  .search-pill { display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:7px 14px; font-size:12.5px; color:var(--ink-3); width:220px; }
  .search-pill input { border:none; background:none; outline:none; font-size:12.5px; flex:1; color:var(--ink); }
  .icon-btn { position:relative; width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
  .icon-btn .dot { position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--red); }
  .ai-pill { display:flex; align-items:center; gap:6px; background:var(--brand-bg); color:var(--brand); border:none; border-radius:20px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .user-chip { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .uavatar { width:30px; height:30px; border-radius:50%; background:var(--hero); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .notif-panel { position:absolute; top:60px; right:28px; width:320px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 8px 24px rgba(16,24,40,.12); padding:8px; z-index:50; }
  .notif-item { display:flex; gap:10px; padding:10px 10px; border-radius:10px; }
  .notif-item:hover { background:var(--bg); }
  .notif-item .nicon { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; }
  .notif-item .ntitle { font-size:12.5px; font-weight:600; }
  .notif-item .ndesc { font-size:11px; color:var(--ink-2); }

  .content { padding:26px 28px; max-width:1100px; }
  .section-title { font-size:21px; font-weight:800; margin:0 0 5px; letter-spacing:-.01em; color:var(--ink); }
  .section-sub { font-size:12.5px; color:var(--ink-2); margin:0 0 22px; line-height:1.5; }
  .caveat { background:var(--amber-bg); color:var(--amber-line); font-size:12px; border-radius:10px; padding:10px 14px; margin-bottom:16px; }

  /* ---- Cards / pills / buttons (shared) ---- */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin-bottom:14px; }
  .pill { font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px; display:inline-block; }
  .pill.good,.pill.A,.pill.completed { background:var(--green-bg); color:var(--green); }
  .pill.warn,.pill.B,.pill.behind,.pill.readiness { background:var(--amber-bg); color:var(--amber-line); }
  .pill.neutral,.pill.C { background:var(--bg); color:var(--ink-2); border:1px solid var(--border); }
  .pill.bad { background:var(--red-bg); color:var(--red); }
  .pill.info { background:var(--blue-bg); color:var(--blue); }
  .pill.brand { background:var(--brand-bg); color:var(--brand); }

  select, .sel { border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:12.5px; background:var(--bg); }
  .btn { font-size:12px; font-weight:700; padding:9px 18px; border-radius:10px; border:none; cursor:pointer; background:var(--ink); color:#fff; }
  .btn.secondary { background:var(--brand-bg); color:var(--brand); }
  .btn.locked, .btn:disabled { background:var(--green-bg); color:var(--green); cursor:default; }
  .btn.small { font-size:11px; padding:6px 12px; }
  .btn.outline { background:#fff; border:1.5px solid var(--ink); color:var(--ink); }

  table.t { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.t th { text-align:left; font-size:10.5px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.03em; padding:8px 6px; border-bottom:1px solid var(--border); }
  table.t td { padding:8px 6px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.t tr.click { cursor:pointer; }
  table.t tr.click:hover { background:var(--bg); }

  /* ---- Home: hero + pastel stats + side panel ---- */
  .greet { font-size:22px; font-weight:800; margin:2px 0 2px; }
  .greet-sub { font-size:13px; color:var(--ink-2); }
  .greet-row { display:flex; align-items:flex-start; margin-bottom:18px; }
  .greet-actions { margin-left:auto; display:flex; gap:8px; }

  .home-grid { display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start; }
  .hero { background:var(--hero); color:#fff; border-radius:20px; padding:22px 24px; margin-bottom:14px; }
  .hero-top { display:flex; justify-content:space-between; align-items:flex-start; }
  .hero-top h3 { margin:0; font-size:15px; font-weight:700; }
  .hero-badge { background:rgba(47,158,92,.18); color:#5CD98A; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; display:flex; align-items:center; gap:4px; }
  .hero-desc { font-size:12px; color:#A5A6B5; margin:8px 0 16px; max-width:320px; }
  .hero-num { font-size:38px; font-weight:800; margin-bottom:14px; }
  .hero-pills { display:flex; gap:8px; }
  .hero-pill { font-size:11.5px; font-weight:600; padding:7px 13px; border-radius:20px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); }
  .hero-pill.solid { background:#fff; color:var(--hero); }

  .stat-row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  .stat3 { border-radius:16px; padding:14px 16px; }
  .stat3.mint { background:var(--mint-bg); }
  .stat3.amber { background:var(--amber-bg); }
  .stat3.lav { background:var(--lav-bg); }
  .stat3 .l { font-size:11.5px; font-weight:600; color:var(--ink); margin-bottom:10px; }
  .stat3 .v { font-size:22px; font-weight:800; }
  .stat3 .s { font-size:10.5px; color:var(--ink-2); margin-top:2px; }

  .tier-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tier-tile { border:1px solid var(--border); border-radius:12px; padding:10px 12px; cursor:pointer; }
  .tier-tile .l { font-size:10px; color:var(--ink-2); margin-bottom:4px; }
  .tier-tile .v { font-size:17px; font-weight:800; }

  .rank-list { list-style:none; margin:0; padding:0; }
  .rank-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--border); cursor:pointer; }
  .rank-row:first-child { border-top:none; }
  .rank-avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; flex-shrink:0; }
  .rank-name { font-size:12.5px; font-weight:600; }
  .rank-sub { font-size:10.5px; color:var(--ink-2); }

  /* ---- Assessment goal cards ---- */
  .goal-card { border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:12px; }
  .goal-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .goal-head .gtitle { font-size:13.5px; font-weight:700; flex:1; }
  .driver-item { display:grid; grid-template-columns:1fr 230px; gap:10px; align-items:flex-start; padding:8px 0; font-size:12.5px; }
  .driver-item select { margin-top:2px; }
  .assess-item { border-bottom:1px solid var(--border); padding:14px 0; }
  .assess-item:first-child { padding-top:0; }
  .assess-item:last-child { border-bottom:none; padding-bottom:0; }
  .item-name { font-size:13px; font-weight:700; margin-bottom:6px; }
  .indicator-list { margin:0 0 10px; padding-left:18px; font-size:11.5px; color:var(--ink-2); line-height:1.55; }
  .indicator-list li { margin-bottom:3px; }
  .item-rate-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .item-feedback-row { display:flex; gap:8px; align-items:flex-start; }
  .item-feedback-row textarea { flex:1; border:1px solid var(--border); border-radius:8px; padding:7px 10px; font-size:12px; font-family:inherit; resize:vertical; }
  .mic-btn { width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:14px; flex-shrink:0; }
  .mic-btn.listening { background:var(--red); color:#fff; border-color:var(--red); }
  .dictate-note { font-size:10.5px; color:var(--ink-3); margin-top:4px; min-height:14px; }
  .caption-text { font-size:11px; color:var(--ink-2); line-height:1.35; margin-top:2px; cursor:help; }
  .summary-badge { display:flex; align-items:center; gap:10px; background:var(--brand-bg); border-radius:14px; padding:10px 16px; margin-left:auto; }
  .summary-badge .snum { font-size:20px; font-weight:800; color:var(--brand); }

function managerOf(empId) { return MANAGER_MAP[empId] || null; }

/* ============================================================
   COMPUTED HELPERS
   ============================================================ */
function emp(id) { return DB.employees.find(e => e.id === id); }
function zoneOf(box) { return box ? DB.nineBoxConfig[box] : null; }
function boxFromRatings(perf, pot) {
  const map = {'High-High':9,'High-Med':8,'High-Low':7,'Med-High':6,'Med-Med':5,'Med-Low':4,'Low-High':3,'Low-Med':2,'Low-Low':1};
  return map[pot + '-' + perf];
}
function idpProgress(activities) {
  if (!activities || activities.length === 0) return 0;
  const w = {Completed:1, 'In Progress':0.5, Behind:0.25, 'Not Started':0};
  return Math.round((activities.reduce((s,a) => s + w[a.status], 0) / activities.length) * 100);
}
function aZoneCount(pool) { return (pool||DB.employees).filter(e => zoneOf(e.box) === 'A').length; }
function totalAssessed(pool) { return (pool||DB.employees).filter(e => e.box != null).length; }
function pendingAssessment(pool) { return (pool||DB.employees).filter(e => e.box == null); }
function successionCoverage() {
  const covered = DB.criticalRoles.filter(r => DB.employees.some(e => e.successorForRoles && e.successorForRoles.includes(r.id))).length;
  const total = DB.criticalRoles.length;
  const pct = total > 0 ? Math.round((covered/total)*100) : 0;
  return {covered, total, pct};
}
function successorsFor(roleId) { return DB.employees.filter(e => e.successorForRoles && e.successorForRoles.includes(roleId)); }
function computeBenchStrength(roleId) {
  const successors = successorsFor(roleId);
  if (successors.length === 0) return 'Critical';
  if (successors.length >= 2) return 'Strong';
  return successors[0].majorGap ? 'Weak' : 'Moderate';
}
function BENCH_COLOR(b) { return {Strong:'good', Moderate:'info', Weak:'warn', Critical:'bad'}[b]; }
function detectSinglePointDependency() {
  return DB.employees.filter(e => e.successorForRoles && e.successorForRoles.length > 1);
}
function logAudit(action, target, oldValue, newValue, reason) {
  DB.auditLog.unshift({
    who: CURRENT_USER.name, whoRole: CURRENT_USER.role,
    action, target, oldValue, newValue, reason: reason || '—',
    timestamp: new Date().toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'}),
  });
}
function readinessCounts() {
  const counts = {}; DB.readinessTiers.forEach(t => counts[t] = 0);
  DB.employees.forEach(e => { if (e.readiness) counts[e.readiness] = (counts[e.readiness]||0) + 1; });
  return counts;
}
function aZoneNoIdp() { return DB.employees.filter(e => zoneOf(e.box) === 'A' && (!e.idp || e.idp.length === 0)); }
function rolesWithoutSuccessor() { return DB.criticalRoles.filter(r => !DB.employees.some(e => e.successorForRoles && e.successorForRoles.includes(r.id))); }
function greenZoneTalents(pool) { return (pool||DB.employees).filter(e => zoneOf(e.box) === 'A'); }
function cZoneTalents(pool) { return (pool||DB.employees).filter(e => zoneOf(e.box) === 'C'); }
function idpCreatedCount(pool) { return (pool||DB.employees).filter(e => e.idp && e.idp.length > 0).length; }
function idpStatusBreakdown(pool) {
  const counts = {Completed:0, 'In Progress':0, Behind:0, 'Not Started':0};
  (pool||DB.employees).forEach(e => (e.idp||[]).forEach(a => counts[a.status]++));
  return counts;
}
function boxDistribution(pool) {
  const counts = {};
  for (let b=1; b<=9; b++) counts[b] = 0;
  (pool||DB.employees).forEach(e => { if (e.box) counts[e.box]++; });
  return counts;
}
function deptBreakdown(pool) {
  const byDept = {};
  (pool||DB.employees).forEach(e => {
    const d = e.dept || 'Unspecified';
    if (!byDept[d]) byDept[d] = {dept: d, total: 0, assessed: 0};
    byDept[d].total++;
    if (e.box) byDept[d].assessed++;
  });
  return Object.values(byDept).sort((a,b) => b.assessed - a.assessed);
}
// Placeholder metric: no real Critical Role / Succession Nomination data exists yet
// (DB.criticalRoles is empty by design — see the comment where it's defined). This
// computes correctly and will populate on its own once real critical roles and
// successors are added; it doesn't need to be rewritten later.
function execDmSuccessionCoverage(pool) {
  const total = (pool||DB.employees).filter(e => e.level==='EXEC' || e.level==='DM').length;
  const identified = DB.criticalRoles.filter(r => {
    const incumbent = emp(r.incumbentId);
    return incumbent && (incumbent.level==='EXEC' || incumbent.level==='DM') && successorsFor(r.id).length > 0;
  }).length;
  return {total, identified};
}
function behindItems(pool) { return (pool||DB.employees).flatMap(e => (e.idp||[]).filter(a=>a.status==='Behind').map(a=>({emp:e,activity:a}))); }

   Determine org scope -> Load appropriate dashboard.

   PROTOTYPE NOTE: this is a client-side simulation of that flow for
   demonstration only. There is no server here, so nothing below is
   real access control — a determined user could open dev tools and
   read the full DB regardless of the "logged in" identity. Real
   enforcement requires the backend described in the engineering
   handoff document (Entra ID auth + API-layer permission checks on

const AVATAR_COLORS = ['#7C1F3D','#4C5FD5','#2F9E5C','#C98A1F','#6B4FC9','#C4433A'];
function avatarColor(id) { let h=0; for (const c of id) h = (h*31 + c.charCodeAt(0))>>>0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function filterSelectOptions(selectId, query) {
  const q = query.trim().toLowerCase();
  const select = document.getElementById(selectId);
  if (!select) return;
  let firstVisible = null;
  Array.from(select.options).forEach(opt => {
    const match = opt.textContent.toLowerCase().includes(q);
    opt.hidden = !match;
    if (match && firstVisible === null) firstVisible = opt;
  });
  if (firstVisible && select.selectedOptions[0] && select.selectedOptions[0].hidden) {
    select.value = firstVisible.value;
  }
}

function renderRail() {
  const cats = visibleCategories();
  const activeCat = categoryFor(currentView).id;
  document.getElementById('rail').innerHTML = `<div class="rail-logo" onclick="nav(&#39;home&#39;)" style="cursor:pointer" title="Go to Home"><img src="data:image/png;base64,${LOGO_B64}" alt="Talent360"></div>` + cats.map(c => `
    <button class="rail-item ${c.id===activeCat?'active':''}" onclick="setCategory('${c.id}')">
      <span class="ricon"></span><span>${c.label}</span>
    </button>
  `).join('');
}
function renderSubpanel() {
  const cat = categoryFor(currentView);
  document.getElementById('subpanel').innerHTML = `<h4>${cat.label}</h4>` + cat.items.map(i => `
    <button class="subitem ${i.v===currentView?'active':''}" onclick="nav('${i.v}')">${i.label}</button>
  `).join('');
}
function setCategory(catId) {
  const cat = visibleCategories().find(c => c.id === catId);
  nav(cat.items[0].v);
}
function nav(v) {
  // Defense-in-depth: even if something tried to navigate to a hidden view directly,
  // fall back to a permitted one. This is still only a UI-layer check — see the
  // RBAC block above for why that's not real enforcement.
  const allowed = visibleCategories().some(c => c.items.some(i => i.v === v));
  if (!allowed) v = visibleCategories()[0].items[0].v;
  currentView = v;
  renderRail();
  renderSubpanel();
  renderBottomTabs();
  render();
  playContentTransition();
  closeMobileSheet();
}
// Retriggers the fade-in animation — used on module navigation only, not on every
// internal update (changing a dropdown, locking a calibration row, etc.), since
// re-fading the whole panel on every micro-interaction would feel janky, not premium.
function playContentTransition() {
  const el = document.getElementById('content');
  el.classList.remove('fade-in');
  void el.offsetWidth; // force reflow so the animation restarts
  el.classList.add('fade-in');
}
function render() {
  const fn = {home:renderHome, cycle:renderCycle, assess:renderAssess, calib:renderCalib, ninebox:renderNineBox,
    succession:renderSuccession, idp:renderIDP, profile:renderProfile, mentoring:renderMentoring,
    admin:renderAdmin, analytics:renderAnalytics, audit:renderAudit}[currentView];
  fn();
}

/* ---- Notification center ---- */
function toggleNotif() {
  const panel = document.getElementById('notifPanel');
  document.getElementById('userMenuPanel').style.display = 'none';
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  const scoped = CURRENT_USER.role === 'PEOPLE_MANAGER';
  const pool = scoped ? myTeam() : undefined;
  const items = [];
  pendingAssessment(pool).forEach(e => items.push({icon:'📝', color:'var(--brand-bg)', title:`${e.name} — assessment pending`, desc:'Not yet submitted for this cycle'}));
  behindItems(pool).forEach(b => items.push({icon:'⚠️', color:'var(--amber-bg)', title:`${b.emp.name} — activity behind`, desc:b.activity.goal}));
  if (!scoped) rolesWithoutSuccessor().forEach(r => items.push({icon:'☁️', color:'var(--red-bg)', title:`${r.title} — no successor`, desc:'Critical role uncovered'}));
  panel.innerHTML = items.length ? items.map(n => `
    <div class="notif-item"><div class="nicon" style="background:${n.color};">${n.icon}</div>
      <div><div class="ntitle">${n.title}</div><div class="ndesc">${n.desc}</div></div></div>
  `).join('') : `<div class="notif-item"><div class="ndesc">You're all caught up.</div></div>`;
  panel.style.display = 'block';
}
function toggleUserMenu() {
  const panel = document.getElementById('userMenuPanel');
  document.getElementById('notifPanel').style.display = 'none';
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  document.getElementById('userMenuWhoami').textContent = `Signed in as ${CURRENT_USER.role === 'SUPER_ADMIN' ? 'Super Admin' : CURRENT_USER.role === 'PEOPLE_MANAGER' ? 'People Manager' : 'Employee'}`;
  panel.style.display = 'block';
}

function signBackIn(loginId) {

}
// ---- Mobile bottom tab bar ----
// Renders one tab per visible category (role-filtered, same source as the desktop
// rail). Tapping a tab whose category has a single module navigates straight there;
// a multi-module category opens a slide-up sheet listing them, which is fewer taps
// than a hamburger and matches how native apps handle this.
function renderBottomTabs() {
  const cats = visibleCategories();
  const activeCatId = categoryFor(currentView).id;
  document.getElementById('bottomTabs').innerHTML = cats.map(c => `
    <button class="tab-item ${c.id === activeCatId ? 'active' : ''}" onclick="onTabTap('${c.id}')">
      <span class="tab-dot"></span>
      <span>${c.label}</span>
    </button>
  `).join('');
}
function onTabTap(catId) {
  const cat = visibleCategories().find(c => c.id === catId);
  if (!cat) return;
  if (cat.items.length === 1) { closeMobileSheet(); nav(cat.items[0].v); return; }
  openMobileSheet(cat);
}
function openMobileSheet(cat) {
  document.getElementById('sheetTitle').textContent = cat.label;
  document.getElementById('sheetItems').innerHTML = cat.items.map(i => `
    <button class="sheet-item ${i.v === currentView ? 'active' : ''}" onclick="closeMobileSheet(); nav('${i.v}');">${i.label}</button>
  `).join('');
  document.getElementById('mobileSheet').classList.add('open');
  document.querySelector('.shell').classList.add('mobile-nav-open');
}
function closeMobileSheet() {
  document.getElementById('mobileSheet').classList.remove('open');
  document.querySelector('.shell').classList.remove('mobile-nav-open');
}

  const pool = isTeamView ? myTeam() : DB.employees;
  const cov = successionCoverage(); // enterprise-wide even for PM, per spec's "limited team scope" for succession module itself, not this summary tile
  const totalAssessedN = totalAssessed(pool);
  const greenZone = greenZoneTalents(pool);
  const cZone = cZoneTalents(pool);
  const idpCreated = idpCreatedCount(pool);
  const idpStatus = idpStatusBreakdown(pool);
  const boxDist = boxDistribution(pool);
  const deptRows = deptBreakdown(pool);
  const execDmSuccession = execDmSuccessionCoverage(pool);

const CYCLE_STATUSES = ['Draft','Assessment Open','Assessment Submitted','Calibration In Progress','Finalized','IDP Creation','Development Tracking','Closed'];
function renderCycle() {
  let html = `<p class="section-title">Talent review cycles</p><p class="section-sub">Every cycle is retained — starting 2027 does not touch 2026's results. Only one cycle is "active" at a time (drives Assessment/Calibration/Home); switch which one with the button on its card.</p>`;
  DB.cycles.forEach(c => {
    const idx = CYCLE_STATUSES.indexOf(c.status);
    const isActive = c.id === DB.activeCycleId;
    html += `<div class="card" ${isActive?'style="border-color:var(--brand);"':''}>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
        <div><div style="font-size:16px;font-weight:800;">${c.name} ${isActive?'<span class="pill brand">Active</span>':''}</div><div style="font-size:12.5px;color:var(--ink-2);">${c.targetPopulation}</div></div>
        ${!isActive ? `<button class="btn small secondary" onclick="setActiveCycle('${c.id}')">Make active</button>` : ''}
      </div>
      <div class="stat-row3">
        <div class="stat3 mint"><div class="l">Assessment window</div><div class="v" style="font-size:14px;">${c.assessmentStart} → ${c.assessmentEnd}</div></div>
        <div class="stat3 amber"><div class="l">Calibration window</div><div class="v" style="font-size:14px;">${c.calibrationStart} → ${c.calibrationEnd}</div></div>
        <div class="stat3 lav"><div class="l">IDP deadline</div><div class="v" style="font-size:14px;">${c.idpDeadline}</div></div>
      </div>
      <div class="prow"><span class="lbl">Cycle owner</span>${c.owner}</div>
      <div class="prow">
        <span class="lbl">Workflow status</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${CYCLE_STATUSES.map((s,i) => `<span class="pill ${i<idx?'good':i===idx?'brand':'neutral'}">${i+1}. ${s}</span>`).join('')}
        </div>
        ${isActive && idx < CYCLE_STATUSES.length-1 ? `<button class="btn small" style="margin-top:12px;" onclick="advanceCycle('${c.id}')">Advance to "${CYCLE_STATUSES[idx+1]}" →</button>` : ''}
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML = html;
}
function setActiveCycle(cycleId) {
  const old = DB.activeCycleId;
  DB.activeCycleId = cycleId;
  logAudit('Active cycle changed', activeCycle().name, old, cycleId, 'Switched which cycle drives Assessment/Calibration/Home');
  renderCycle();
}
function advanceCycle(cycleId) {
  const c = DB.cycles.find(x => x.id === cycleId);
  const idx = CYCLE_STATUSES.indexOf(c.status);
  const oldStatus = c.status;
  c.status = CYCLE_STATUSES[idx+1];
  logAudit('Cycle status advanced', c.name, oldStatus, c.status, 'Manual stage advancement');
  renderCycle();
}

function sectionRating(vals, threshold) {
  const avg = vals.reduce((s,v)=>s+VAL[v],0)/vals.length;
  if (avg >= threshold) return 'High'; if (avg >= 1.6) return 'Med'; return 'Low';
}
function performanceFinal(bi, val) { if (bi==='Low'||val==='Low') return 'Low'; if (bi==='High') return 'High'; return 'Med'; }
function potentialFinal(a,b,c) {
  const vals=[a,b,c]; const H=vals.filter(v=>v==='High').length, L=vals.filter(v=>v==='Low').length, M=vals.filter(v=>v==='Med').length;
  if (H===3) return 'High'; if (L>=2) return 'Low'; if (M>=2 && L===1) return 'Low'; return 'Med';
}

  document.getElementById('potBadge').textContent = pot.toUpperCase();

/* ============================================================
   SPEECH-TO-TEXT DICTATION — available on every rated item's
   feedback field, plus the overall Manager Feedback field.
   Uses the browser's native Web Speech API (SpeechRecognition /
   webkitSpeechRecognition) — no external package or install step
   exists for a static HTML file; this IS the "plug-in," built
   into Chrome and Edge. NOT supported in Firefox or Safari as of
   this writing. Requires a secure context (https:// or localhost)
   and explicit microphone permission — it will not work silently.
   Only one field can dictate at a time; starting a new one stops
   whichever was previously listening.
   ============================================================ */
let dictationRecognition = null;
let dictatingBtnId = null;
function speechSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function initMicButton(btnId) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (!speechSupported()) {
    btn.disabled = true; btn.style.opacity = 0.35;
    btn.title = 'Speech-to-text needs Chrome or Edge, and a secure (https) connection.';
  } else {
    btn.disabled = false; btn.style.opacity = 1;
    btn.title = 'Click to dictate';
  }
}
function toggleDictation(empId, itemKey, textareaId, btnId, noteId) {
  if (dictatingBtnId === btnId) { dictationRecognition.stop(); return; }
  if (dictatingBtnId && dictationRecognition) { dictationRecognition.stop(); }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const textarea = document.getElementById(textareaId);
  const btn = document.getElementById(btnId);
  const note = document.getElementById(noteId);
  let baseText = textarea.value ? textarea.value.trim() + ' ' : '';

  dictationRecognition = new SpeechRecognition();
  dictationRecognition.continuous = true;
  dictationRecognition.interimResults = true;
  dictationRecognition.lang = 'en-US';
  dictatingBtnId = btnId;

  dictationRecognition.onstart = () => {
    btn.textContent = '⏺'; btn.classList.add('listening');
    if (note) note.textContent = 'Listening...';
  };
  dictationRecognition.onresult = (event) => {
    let interim = '', final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t + ' '; else interim += t;
    }
    if (final) baseText += final;
    textarea.value = baseText + interim;
    saveDraftField(empId, itemKey, textarea.value);
  };
  dictationRecognition.onerror = (event) => {
    if (note) note.textContent = (event.error==='not-allowed'||event.error==='permission-denied')
      ? 'Microphone access denied.' : `Dictation error: ${event.error}`;
    resetMicButton(btnId, noteId);
  };
  dictationRecognition.onend = () => resetMicButton(btnId, noteId);
  dictationRecognition.start();
}
function resetMicButton(btnId, noteId) {
  dictatingBtnId = null;
  const btn = document.getElementById(btnId);
  const note = document.getElementById(noteId);
  if (btn) { btn.textContent = '🎤'; btn.classList.remove('listening'); }
  if (note) note.textContent = '';
}

    const changed = c.calibrated.perf !== c.original.perf || c.calibrated.pot !== c.original.pot;
    html += `
      <tr><td rowspan="4"><b>${e.name}</b></td>
        <td>Original</td><td>${c.original.perf}</td><td>${c.original.pot}</td>

      <tr><td>Calibrated</td>
        <td><select onchange="updateCalib('${id}','perf',this.value)">${ratingOptionsPlain(c.calibrated.perf)}</select></td>
        <td><select onchange="updateCalib('${id}','pot',this.value)">${ratingOptionsPlain(c.calibrated.pot)}</select></td>
        <td><span class="pill ${zoneOf(calBox)}">Box ${calBox} · ${zoneOf(calBox)}</span></td><td></td></tr>
      <tr><td colspan="4">${changed ? `<input type="text" placeholder="Reason for change (required to lock)" value="${c.reason||''}" oninput="DB.calibration['${id}'].reason=this.value;" style="width:100%;border:1px solid ${(!c.reason)?'var(--red)':'var(--border)'};border-radius:8px;padding:6px 10px;font-size:12px;">` : ''}</td><td></td></tr>
      <tr><td>Final</td><td colspan="2">${c.locked ? 'Locked' : 'Not yet locked'}</td>
        <td><button class="btn small ${c.locked?'locked':''}" onclick="lockCalib('${id}')" ${c.locked?'disabled':''}>${c.locked?'Locked':'Lock'}</button></td></tr>
    `;
  });
  html += `</tbody></table>`;
  document.getElementById('content').innerHTML = html;
}
function updateCalib(id, field, value) { DB.calibration[id].calibrated[field] = value; renderCalib(); }
function lockCalib(id) {
  const c = DB.calibration[id]; const e = emp(id);
  const changed = c.calibrated.perf !== c.original.perf || c.calibrated.pot !== c.original.pot;
  if (changed && !c.reason) { alert('A reason for change is required before this rating can be locked.'); return; }
  c.locked = true;
  const oldBox = e.box;
  e.box = boxFromRatings(c.calibrated.perf, c.calibrated.pot);
  logAudit('Calibration locked', e.name,
    `Box ${oldBox||'—'} (${c.original.perf}/${c.original.pot})`,
    `Box ${e.box} (${c.calibrated.perf}/${c.calibrated.pot})`,
    changed ? c.reason : 'No change from original assessment');
  renderCalib();
}

  const scoped = CURRENT_USER.role === 'PEOPLE_MANAGER';
  const pool = scoped ? myTeam() : DB.employees;
  const opts = pool.map(e => `<option value="${e.id}">${e.name}</option>`).join('');
  const existing = document.getElementById('profileEmp');
  const selected = existing && pool.some(e=>e.id===existing.value) ? existing.value : (pool[0] ? pool[0].id : null);
  if (!selected) { document.getElementById('content').innerHTML = `<div class="card">You have no direct reports to view.</div>`; return; }
  const e = emp(selected);
  const zone = zoneOf(e.box);
  const successorRoles = (e.successorForRoles||[]).map(rid => DB.criticalRoles.find(r=>r.id===rid));

  const tabs = [['overview','Overview'],['performance','Performance'],['development','Development'],['succession','Succession']];
  let body = '';
  if (profileTab === 'overview') {
    body = `
      <div class="prow"><span class="lbl">Snapshot</span>
        ${e.box ? `<span class="pill ${zone}">Box ${e.box} · ${zone}-Zone</span>` : `<span class="pill bad">Not yet assessed</span>`}
        ${successorRoles.length ? ` <span class="pill readiness">${e.readiness}</span>` : ''}
      </div>
      <div class="prow"><span class="lbl">Development progress — ${idpProgress(e.idp)}%</span>
        <div class="bar-track"><div class="bar-fill" style="width:${idpProgress(e.idp)}%;"></div></div>
      </div>
      <div class="prow"><span class="lbl">Department</span>${e.dept} · Level ${e.level}</div>
    `;
  } else if (profileTab === 'performance') {
    const compKeys = Object.keys(e.competencies || {});
    body = `
      <div class="prow"><span class="lbl">Talent assessment</span>
        ${e.box ? `<span class="pill ${zone}">Box ${e.box} · ${zone}-Zone</span>` : `<span class="pill bad">Not yet assessed</span>`}
        ${e.perf ? ` <span class="pill neutral">Performance: ${e.perf}</span>` : ''}
        ${e.pot ? ` <span class="pill neutral">Potential: ${e.pot}</span>` : ''}
      </div>
      <div class="prow"><span class="lbl">Individual competency ratings</span>
        ${compKeys.length ? `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;">
            ${compKeys.map(k => `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);"><span>${k}</span><span class="pill ${e.competencies[k]==='High'?'good':e.competencies[k]==='Med'?'warn':'bad'}">${e.competencies[k]}</span></div>`).join('')}
          </div>
        ` : `<div style="font-size:12px;color:var(--ink-3);">No competency ratings on file — not yet assessed this cycle.</div>`}
      </div>
    `;
  } else if (profileTab === 'development') {
    body = `
      <div class="prow"><span class="lbl">IDP — ${idpProgress(e.idp)}%</span>
        <div class="bar-track"><div class="bar-fill" style="width:${idpProgress(e.idp)}%;"></div></div>
        ${(e.idp||[]).length ? e.idp.map(a=>`<div style="margin-top:10px;font-size:12.5px;display:flex;justify-content:space-between;"><span>${a.goal}</span><span class="pill ${a.status==='Completed'?'good':a.status==='Behind'?'bad':'neutral'}">${a.status}</span></div>`).join('') : '<div style="font-size:12px;color:var(--ink-3);margin-top:6px;">No development activities on file.</div>'}
      </div>
    `;
  } else if (profileTab === 'succession') {
    if (successorRoles.length) {
      body = successorRoles.map(role => `
        <div class="prow">
          <span class="lbl">Nominated successor</span>
          <b>${role.title}</b> <span class="pill readiness">${e.readiness}</span> <span class="pill neutral">Priority: ${e.priority}</span>
          <div style="font-size:12px;color:var(--ink-2);margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            <span><b>Gap:</b> ${e.successorGap||'—'}</span>
            <span><b>Strengths:</b> ${e.successorStrengths||'—'}</span>
            <span><b>Risk:</b> ${e.successorRisks||'—'}</span>
            <span><b>Last reviewed:</b> ${e.lastReadinessReview||'—'} · <b>Target:</b> ${e.targetReadinessDate||'—'}</span>
          </div>
        </div>
      `).join('');
      if (successorRoles.length > 1) body = `<div class="caveat">⚠ Nominated for ${successorRoles.length} critical roles simultaneously — single-point dependency.</div>` + body;
    } else {
      body = `<div class="prow"><span class="lbl">Succession</span>Not currently a named successor.</div>`;
    }
  }

  document.getElementById('content').innerHTML = `
    <div style="margin-bottom:14px;">
      <input type="text" placeholder="Search ${pool.length} talent by name..." oninput="filterSelectOptions('profileEmp', this.value)" style="width:300px;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:6px;display:block;">
      <select id="profileEmp" onchange="renderProfile()">${opts}</select>
    </div>
    <div class="profile-head">
      <div class="avatar">${e.initials}</div>
      <div><div style="font-size:17px;font-weight:700;">${e.name}</div><div style="font-size:12.5px;color:#C9CAD6;">${e.position} · ${e.dept}</div>
      ${canSee('age') ? `<div style="font-size:11.5px;color:#8892B0;margin-top:4px;">Age ${e.age} · Level ${e.level}</div>` : `<div style="font-size:11px;color:#6E7BA0;margin-top:4px;">Age hidden — not permitted for this role</div>`}
      </div>
    </div>
    <div class="tab-bar">${tabs.map(([id,label])=>`<button class="tab-btn ${profileTab===id?'active':''}" onclick="setProfileTab('${id}')">${label}</button>`).join('')}</div>
    <div class="profile-body">${body}</div>
  `;
  document.getElementById('profileEmp').value = selected;
}
function setProfileTab(t) { profileTab = t; renderProfile(); }

/* ============================================================
   MENTORING
   ============================================================ */
function renderMentoring() {
  const relationships = DB.employees.filter(e => e.mentorId).map(e => ({mentee:e, mentor:emp(e.mentorId)}));
  let html = `<p class="section-title">Mentoring</p><p class="section-sub">Relationship-scoped — a mentor's access here comes from being named, not from reporting line.</p>`;
  if (relationships.length === 0) {
    html += `<div class="card">No mentoring relationships on file. The masterlist is HRIS/org data — it doesn't capture mentoring, which has to be established manually (set an employee's <code>mentorId</code>).</div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }
  relationships.forEach(r => {
    html += `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <span><b>${r.mentor.name}</b> mentors <b>${r.mentee.name}</b>${(r.mentee.successorForRoles&&r.mentee.successorForRoles.length) ? ' — Succession: '+r.mentee.successorForRoles.map(rid=>DB.criticalRoles.find(x=>x.id===rid).title).join(', ') : ''}</span>
      <button class="btn small secondary" onclick="goProfile('${r.mentee.id}')">View mentee profile</button>
    </div>`;
  });
  document.getElementById('content').innerHTML = html;
}

/* ============================================================
   ADMIN / CONFIG
   ============================================================ */
function renderAdmin() {
  let html = `<p class="section-title">Admin / configuration</p><p class="section-sub">Changes here take effect immediately across 9-Box and Talent Profile.</p>`;
  html += `<div class="card"><b style="font-size:12.5px;">9-box zone mapping</b>`;
  for (let box=9; box>=1; box--) {
    html += `<div class="prow" style="padding:6px 0;display:flex;justify-content:space-between;"><span>Box ${box}</span>
      <select onchange="DB.nineBoxConfig[${box}]=this.value;render();">${['A','B','C'].map(z=>`<option ${DB.nineBoxConfig[box]===z?'selected':''}>${z}</option>`).join('')}</select></div>`;
  }
  html += `</div><div class="card"><b style="font-size:12.5px;">Field permissions — Age</b>
    <p style="font-size:11px;color:var(--ink-2);margin:6px 0 12px;">Employee role has no path to viewing others' profiles at all, so it isn't listed here — this matrix only governs what Super Admin and People Manager can see.</p>`;
  ['SUPER_ADMIN','PEOPLE_MANAGER'].forEach(role => {
    html += `<div class="prow" style="padding:6px 0;display:flex;justify-content:space-between;"><span>${{SUPER_ADMIN:'Super Admin',PEOPLE_MANAGER:'People Manager'}[role]}</span>
      <select onchange="DB.fieldPermissions.age['${role}']=this.value;render();">${['none','read'].map(p=>`<option ${DB.fieldPermissions.age[role]===p?'selected':''}>${p}</option>`).join('')}</select></div>`;
  });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function renderAnalytics() {
  const cov = successionCoverage();
  document.getElementById('content').innerHTML = `
    <p class="section-title">Executive dashboard</p><p class="section-sub">Computed live from the same pool driving every other module.</p>
    <div class="stat-row3">
      <div class="stat3 mint"><div class="l">Talent Strength (A-Zone)</div><div class="v">${Math.round((aZoneCount()/DB.employees.length)*100)}%</div></div>
      <div class="stat3 amber"><div class="l">Succession Risk</div><div class="v">${cov.total ? (cov.covered<cov.total?'Moderate':'Low') : 'Not tracked'}</div><div class="s">${cov.total ? `${cov.total-cov.covered} roles uncovered` : 'No critical roles defined yet'}</div></div>
      <div class="stat3 lav"><div class="l">Critical Role Coverage</div><div class="v">${cov.total ? cov.pct+'%' : '—'}</div></div>
    </div>
    <p class="caveat">This is real July 2026 masterlist data — 1,432 employees (JG≥10 or SUP-and-up), 375 with direct reports. Everyone loads in unassessed (no box, no IDP, no succession nomination) since the masterlist is HRIS data, not talent-review data — that's the correct starting point for testing Assessment → Calibration, not a bug. Competency analytics and the Age × Zone cross-tab shown in the standalone Analytics prototype still use the separate 343-person Potential Drivers workbook, not this population.</p>
  `;
}

/* ============================================================
   AUDIT TRAIL
   ============================================================ */
function renderAudit() {
  let html = `<p class="section-title">Audit trail</p><p class="section-sub">Immutable log of rating changes, cycle status advancement, and other tracked decisions.</p>`;
  if (DB.auditLog.length === 0) {
    html += `<div class="card">No audit events recorded yet. Calibration rating changes and cycle status changes are logged automatically.</div>`;
  } else {
    html += `<table class="t"><thead><tr><th>When</th><th>Who</th><th>Role</th><th>Action</th><th>Target</th><th>Old → New</th><th>Reason</th></tr></thead><tbody>`;
    DB.auditLog.forEach(a => {
      html += `<tr><td>${a.timestamp}</td><td>${a.who}</td><td>${{SUPER_ADMIN:'Super Admin',PEOPLE_MANAGER:'People Manager',EMPLOYEE:'Employee'}[a.whoRole]||a.whoRole}</td><td>${a.action}</td><td>${a.target}</td><td>${a.oldValue} → ${a.newValue}</td><td>${a.reason}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  document.getElementById('content').innerHTML = html;
}

/* ============================================================
   EMPLOYEE VIEW — deliberately not the admin app with things
   hidden. A completely separate, simple shell: "view -> track ->
   update progress/evidence on own IDP", nothing else.
   ============================================================ */
function renderEmployeeView() {
  const e = emp(CURRENT_USER.employeeId);
  const pct = idpProgress(e.idp);
  const dueSoon = (e.idp||[]).filter(a => a.status !== 'Completed').length;
  const overdue = (e.idp||[]).filter(a => a.status === 'Behind').length;
  const done = (e.idp||[]).filter(a => a.status === 'Completed').length;
  document.getElementById('content').innerHTML = `
    <div class="greet-row"><div><div class="greet">My Development</div><div class="greet-sub">Track and update progress on your own IDP. Talent Review, Calibration, and other employees' data are not part of this view.</div></div></div>
    <div class="hero" style="max-width:520px;">
      <div class="hero-top"><h3>IDP Progress</h3></div>
      <div class="hero-num">${pct}%</div>
      <div class="hero-pills">
        <div class="hero-pill">${done} completed</div>
        <div class="hero-pill">${dueSoon} active</div>
        ${overdue ? `<div class="hero-pill" style="background:var(--red);border-color:var(--red);">${overdue} overdue</div>` : ''}
      </div>
    </div>
    <div class="card" style="max-width:640px;">
      <div class="section-title" style="margin-bottom:12px;">My development activities</div>
      ${(e.idp||[]).length ? e.idp.map((a,i) => `
        <div class="prow">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <b style="font-size:13px;">${a.goal}</b>
            <span class="pill ${a.status==='Completed'?'good':a.status==='Behind'?'bad':'neutral'}">${a.status}</span>
          </div>
          <div style="font-size:11.5px;color:var(--ink-2);margin-bottom:8px;">${a.type} · ${a.purpose} · Target ${a.target}</div>
          ${a.status!=='Completed' ? `<button class="btn small secondary" onclick="employeeMarkDone(${i})">Mark as complete</button>` : ''}
        </div>
      `).join('') : '<div class="empty-state" style="color:var(--ink-3);font-size:12.5px;">No development activities on file yet.</div>'}
    </div>
  `;
}
function employeeMarkDone(idx) {
  emp(CURRENT_USER.employeeId).idp[idx].status = 'Completed';
  renderEmployeeView();
}

/* init */
applyShellForRole();
</script>
</body>
</html>
